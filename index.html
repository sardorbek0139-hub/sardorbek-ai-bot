<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonli Ovozli Suhbat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            background-color: #1d4ed8;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎙 Jonli Suhbat rejimi</h2>
        <p>Mikrofonni yoqib, gaplashish uchun tugmani bosing:</p>
        <button id="micBtn" onclick="toggleMic()">Mikrofonni Yoqish</button>
        <div id="status">Holat: To'xtatilgan</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let isListening = false;

        function toggleMic() {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('status');

            if (!isListening) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        isListening = true;
                        btn.textContent = "Mikrofonni O'chirish";
                        btn.style.backgroundColor = "#dc2626";
                        status.textContent = "Holat: Eshitilmoqda (Gapiring...)";
                    })
                    .catch(err => {
                        alert("Mikrofondan foydalanishga ruxsat berilmadi: " + err);
                    });
            } else {
                isListening = false;
                btn.textContent = "Mikrofonni Yoqish";
                btn.style.backgroundColor = "#2563eb";
                status.textContent = "Holat: To'xtatilgan";
            }
        }
    </script>
</body>
</html>
